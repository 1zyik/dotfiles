# ── Reload ─────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── True color ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Prefix ─────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── General ────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-option -g automatic-rename off
set-option -g allow-rename off
set -g escape-time 0
set -g history-limit 10000

# ── Vim pane navigation ────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane borders ───────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── Status bar ─────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#a6adc8"

# Separators (Nerd Font powerline glyphs)
# Solid:  right   left
# Thin:  right   left

# ┌─────────────────────────────────────────────────────────┐
# │  LEFT:  [session segment] > [thin gap]                  │
# └─────────────────────────────────────────────────────────┘
#
#  ██ #S ░░░
#  ^yellow pill         ^fade to bar bg
#
set -g status-left-length 60
set -g status-left "\
#[bg=#f9e2af,fg=#1e1e2e,bold]  #S \
#[bg=#181825,fg=#f9e2af,nobold]\
#[bg=#181825,fg=#585b70] \
#[bg=#1e1e2e,fg=#181825]\
#[default] "

# ┌─────────────────────────────────────────────────────────┐
# │  RIGHT:  [path segment] < [time segment]                │
# └─────────────────────────────────────────────────────────┘
#
#  ░░░  ~/path/here ██ 14:30 ██
#
set -g status-right-length 120
set -g status-right "\
#[bg=#1e1e2e,fg=#181825]\
#[bg=#181825,fg=#585b70] \
#[bg=#181825,fg=#a6e3a1] 󰉋 #{s|$HOME|~|:pane_current_path} \
#[bg=#1e1e2e,fg=#181825]\
#[bg=#1e1e2e,fg=#313244]\
#[bg=#313244,fg=#1e1e2e]\
#[bg=#313244,fg=#89b4fa]  %H:%M \
#[default]"

# ── Window tabs ────────────────────────────────────────────
# Inactive: dim number + name, thin right separator
set-window-option -g window-status-format "\
#[bg=#1e1e2e,fg=#1e1e2e]\
#[bg=#1e1e2e,fg=#45475a]  #I \
#[bg=#1e1e2e,fg=#6c7086]#W \
#[bg=#1e1e2e,fg=#1e1e2e] "

# Active: subtle blue underline + slightly warmer bg lifts it without screaming
set-window-option -g window-status-current-format "\
#[bg=#1e1e2e,fg=#313244]\
#[bg=#313244,fg=#89b4fa,bold,underscore]  #I \
#[bg=#313244,fg=#cdd6f4,nobold,underscore]#W\
#{?window_zoomed_flag,#[fg=#f9e2af] ↑,}\
 \
#[bg=#1e1e2e,fg=#313244,nounderscore] "

set-window-option -g window-status-separator ""

# ── Message / command prompt ───────────────────────────────
set -g message-style "bg=#181825,fg=#f9e2af,bold"
set -g message-command-style "bg=#181825,fg=#89b4fa"

# ── Copy mode ─────────────────────────────────────────────
set-window-option -g mode-style "bg=#313244,fg=#cdd6f4,bold"

# ── Plugins ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

#[bg=NEW,fg=OLD]   ← glyph takes the OLD color as its fg (becomes the arrow "fill")
