# ── Reload ─────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── True color ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Prefix ─────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── General ────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-option -g automatic-rename off
set-option -g allow-rename off
set -g escape-time 0
set -g history-limit 10000

# ── Vim pane navigation ────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane borders ───────────────────────────────────────────
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#00d7ff"

# ── Status bar ─────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0d0d0d,fg=#888888"

# Separators (Nerd Font powerline glyphs)
# Solid:  right   left 
# Thin:  right   left 

# ┌─────────────────────────────────────────────────────────┐
# │  LEFT:  [session segment] > [thin gap]                  │
# └─────────────────────────────────────────────────────────┘
#
#  ██ #S ░░░
#  ^yellow pill         ^fade to bar bg
#
set -g status-left-length 60
set -g status-left "\
#[bg=#ffd700,fg=#0d0d0d,bold]  #S \
#[bg=#1a1a1a,fg=#ffd700,nobold]\
#[bg=#1a1a1a,fg=#444444] \
#[bg=#0d0d0d,fg=#1a1a1a]\
#[default] "

# ┌─────────────────────────────────────────────────────────┐
# │  RIGHT:  [path segment] < [time segment]                │
# └─────────────────────────────────────────────────────────┘
#
#  ░░░  ~/path/here ██ 14:30 ██
#
set -g status-right-length 120
set -g status-right "\
#[bg=#0d0d0d,fg=#1a1a1a]\
#[bg=#1a1a1a,fg=#444444] \
#[bg=#1a1a1a,fg=#00ff87] 󰉋 #{s|$HOME|~|:pane_current_path} \
#[bg=#0d0d0d,fg=#1a1a1a]\
#[bg=#0d0d0d,fg=#2a2a2a]\
#[bg=#2a2a2a,fg=#0d0d0d]\
#[bg=#2a2a2a,fg=#00d7ff]  %H:%M \
#[default]"

# ── Window tabs ────────────────────────────────────────────
# Inactive: dim number + name, thin right separator
set-window-option -g window-status-format "\
#[bg=#0d0d0d,fg=#0d0d0d]\
#[bg=#0d0d0d,fg=#333333]  #I \
#[bg=#0d0d0d,fg=#555555]#W \
#[bg=#0d0d0d,fg=#0d0d0d] "

# Active: subtle cyan underline + slightly warmer bg lifts it without screaming
set-window-option -g window-status-current-format "\
#[bg=#0d0d0d,fg=#1e2a2a]\
#[bg=#1e2a2a,fg=#00d7ff,bold,underscore]  #I \
#[bg=#1e2a2a,fg=#e0f7f7,nobold,underscore]#W\
#{?window_zoomed_flag,#[fg=#ffd700] ↑,}\
 \
#[bg=#0d0d0d,fg=#1e2a2a,nounderscore] "

set-window-option -g window-status-separator ""

# ── Message / command prompt ───────────────────────────────
set -g message-style "bg=#1a1a1a,fg=#ffd700,bold"
set -g message-command-style "bg=#1a1a1a,fg=#00d7ff"

# ── Copy mode ─────────────────────────────────────────────
set-window-option -g mode-style "bg=#2a2a2a,fg=#ffffff,bold"

# ── Plugins ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'
